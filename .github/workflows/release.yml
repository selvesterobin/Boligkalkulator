name: Release

# Push a tag like v1.1.0        -> builds the install zip, publishes a STABLE release.
# Push a tag like v1.1.0-beta.1 -> publishes a PRE-RELEASE (beta channel only).
# Run manually (workflow_dispatch) -> builds the zip as an artifact, no release.
#
# The zip is attached to the GitHub Release with the exact asset name the
# in-plugin updater (Boligkalkulator_GitHub_Updater) expects.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SLUG: boligkalkulator
      ASSET: boligkalkulator.zip
      MAIN: boligkalkulator.php
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and channel
        id: meta
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "${GITHUB_REF}" = "${REF}" ]; then
            REF="manual-${GITHUB_SHA::7}"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          fi
          VERSION="${REF#v}"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if echo "${VERSION}" | grep -q '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify plugin version matches the tag
        if: steps.meta.outputs.is_tag == 'true'
        run: |
          CORE="${{ steps.meta.outputs.version }}"
          CORE="${CORE%%-*}"
          PLUGIN_VER="$(grep -m1 'Version:' "${MAIN}" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r')"
          CONST_VER="$(grep -m1 'BOLIGKALKULATOR_VERSION' "${MAIN}" | sed -E "s/.*'([0-9][^']*)'.*/\1/" | tr -d '\r')"
          echo "Tag core: $CORE | header: $PLUGIN_VER | constant: $CONST_VER"
          if [ "$PLUGIN_VER" != "$CORE" ]; then
            echo "::error::Header version ($PLUGIN_VER) does not match tag ($CORE). Update ${MAIN}."
            exit 1
          fi
          if [ "$CONST_VER" != "$CORE" ]; then
            echo "::error::BOLIGKALKULATOR_VERSION ($CONST_VER) does not match tag ($CORE). Update ${MAIN}."
            exit 1
          fi

      - name: Build install zip
        run: |
          STAGE="${RUNNER_TEMP}/stage"
          mkdir -p "${STAGE}/${SLUG}"
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'scripts' \
            --exclude 'dist' \
            --exclude 'node_modules' \
            --exclude '.vscode' \
            --exclude '.DS_Store' \
            ./ "${STAGE}/${SLUG}/"
          mkdir -p dist
          ( cd "${STAGE}" && zip -rq "${GITHUB_WORKSPACE}/dist/${ASSET}" "${SLUG}" )
          ls -lh dist

      - name: Upload build artifact (manual runs)
        if: steps.meta.outputs.is_tag != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLUG }}-zip
          path: dist/*.zip

      - name: Publish GitHub Release
        if: steps.meta.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Boligkalkulator ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/boligkalkulator.zip
